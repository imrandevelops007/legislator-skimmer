name: Skim legislator sites

on:
  schedule:
    - cron: "0 17 * * *"  # 12:00 PM Eastern (17:00 UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run main collector
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python main.py

      - name: Run analyzer
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: "false"
          GEMINI_MODEL: "gemini-2.5-flash"
          BATCH_SIZE: "3"
          MAX_ITEMS_PER_RUN: "3"
          MAX_PAGE_CHARS: "2500"
          GEMINI_MAX_RETRIES: "2"
          REQUEST_DELAY_SECONDS: "7"
          STOP_ON_QUOTA_EXHAUSTION: "true"
        run: |
          python analyze.py

      - name: Run profile builder
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
          MAX_BILLS_PER_LEGISLATOR: "8"
          MIN_SUBSTANTIVE_BILLS_REQUIRED: "4"
          PROFILE_MAX_RETRIES: "2"
          PROFILE_REQUEST_DELAY_SECONDS: "5"
          STOP_ON_QUOTA_EXHAUSTION: "true"
        run: |
          python profile_builder.py

      - name: Generate and upload reports
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_REPORTS_FOLDER_ID: ${{ secrets.DRIVE_REPORTS_FOLDER_ID }}
          TEMPLATE_DIR: templates
          REPORT_TEMPLATE: report.html
          OVERWRITE_EXISTING_IN_TARGET_FOLDER: "true"
          ONLY_PROCESSED_PROFILES: "true"
        run: |
          python report_generator.py
