name: Skim legislator sites

on:
  schedule:
    - cron: "0 17 * * *"  # 12:00 PM Eastern (17:00 UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run main collector
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python main.py

      - name: Run analyzer
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: "false"
          GEMINI_MODEL: "gemini-2.5-flash"
          BATCH_SIZE: "10"
          MAX_ITEMS_PER_RUN: "10"
          MAX_PAGE_CHARS: "4000"
          GEMINI_MAX_RETRIES: "3"
          REQUEST_DELAY_SECONDS: "3"
          STOP_ON_QUOTA_EXHAUSTION: "true"
        run: |
          python analyze.py

      - name: Run profile builder
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
          MAX_BILLS_PER_LEGISLATOR: "12"
          PROFILE_MAX_RETRIES: "5"
          PROFILE_REQUEST_DELAY_SECONDS: "3"
          ONLY_LEGISLATOR: "Sarah Anthony"
        run: |
          python profile_builder.py

      - name: Generate PDF reports
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ONLY_LEGISLATOR: "Sarah Anthony"
        run: |
          python report_generator.py

      - name: Upload generated reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: legislator-reports
          path: generated_reports/
