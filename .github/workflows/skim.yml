name: Skim legislator sites

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run main collector
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python main.py

      - name: Run analyzer
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: "false"
          GEMINI_MODEL: "gemini-2.5-flash"
          BATCH_SIZE: "1"
          MAX_ITEMS_PER_RUN: "2"
          MAX_PAGE_CHARS: "2500"
          GEMINI_MAX_RETRIES: "3"
          REQUEST_DELAY_SECONDS: "15"
          STOP_ON_QUOTA_EXHAUSTION: "true"
          REPAIR_MISSING_BILL_NUMBERS: "true"
          ONLY_LEGISLATOR: ""

        run: |
          python analyze.py

      - name: Run profile builder
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
          FALLBACK_GEMINI_MODELS: "gemini-2.5-flash-lite,gemini-1.5-flash"
          MAX_BILLS_PER_LEGISLATOR: "12"
          MIN_SUBSTANTIVE_BILLS_REQUIRED: "4"
          MIN_TOTAL_ITEMS_REQUIRED: "6"
          PROFILE_MAX_RETRIES: "3"
          PROFILE_REQUEST_DELAY_SECONDS: "15"
          STOP_ON_QUOTA_EXHAUSTION: "true"
          ONLY_LEGISLATOR: ""
        run: |
          python profile_builder.py

      - name: Generate and upload reports
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_REPORTS_FOLDER_ID: ${{ secrets.DRIVE_REPORTS_FOLDER_ID }}
          TEMPLATE_DIR: "."
          REPORT_TEMPLATE: "report.html"
          OVERWRITE_EXISTING_IN_TARGET_FOLDER: "true"
          ONLY_LEGISLATOR: ""
        run: |
          python report_generator.py

      - name: Upload PDF Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legislator-briefing-sheets
          path: generated_reports/
          retention-days: 5